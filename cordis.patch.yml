# dsh-autorestart bundle layer.
# Every key below is a documented default; override any of them in the profile's
# cordis.patch.yml with an `- id: dsh-autorestart` entry that repeats the full config.
- insert:
    - id: dsh-autorestart
      name: dsh-autorestart
      config:
        enabled: true
        # Empty = <DSH_HOME>/storages/dsh-autorestart/state.json
        stateFile: ''
        resumeOnBoot: true
        recoveryDelayMs: 6000
        maxSessions: 4
        maxResumeAttempts: 2
        deferPollMs: 3000
        deferSoftMs: 300000
        deferHardMs: 900000
        deferPolicy: auto
        # hard deadline only forces a restart over a running conversation when this is
        # enabled; by default it keeps waiting for the other conversations to finish
        forceRestartWhenBusy: false
        # app = relaunch the DeepSeek Harness desktop app; command = run restartCommand
        restartMode: app
        restartCommand: ''
        relaunchDelaySeconds: 2
        # quiet window (ms) after the last conversation activity before a restart may fire
        settleMs: 2000
        # dsh web: reload the page when the host boot token changes
        autoReloadPage: true
        # hard-block shell commands that would kill/relaunch DSH by hand
        blockManualRestart: true
        healthPath: /__dsh_autorestart/health
        continuationText: ''
        # Take a snapshot of the profile before every restart, so a restart that
        # leaves the host unable to boot can be rolled back automatically.
        backupOnRestart: true
        # Include the installed plugin tree in that snapshot (bigger: ~120 MB here,
        # but it is what lets a rollback undo "a plugin upgrade broke the boot").
        backupIncludePlugins: true
        # Keep at most this many snapshots; older ones are deleted automatically.
        maxBackups: 2
        # How long the detached watcher waits for the relaunched host (ms) before
        # it restores the snapshot and launches the host again.
        rollbackTimeoutMs: 90000
