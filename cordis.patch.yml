# dsh-autorestart bundle layer.
# Every key below is a documented default; override any of them in the profile's
# cordis.patch.yml with an `- id: dsh-autorestart` entry that repeats the full config.
- insert:
    - id: dsh-autorestart
      name: dsh-autorestart
      config:
        enabled: true
        # Empty = <DSH_HOME>/storages/dsh-autorestart/state.json
        stateFile: ''
        resumeOnBoot: true
        recoveryDelayMs: 6000
        maxSessions: 4
        maxResumeAttempts: 2
        deferPollMs: 3000
        deferSoftMs: 300000
        deferHardMs: 900000
        deferPolicy: auto
        # hard deadline only forces a restart over a running conversation when this is
        # enabled; by default it keeps waiting for the other conversations to finish
        forceRestartWhenBusy: false
        # app = relaunch the DeepSeek Harness desktop app; command = run restartCommand
        restartMode: app
        restartCommand: ''
        relaunchDelaySeconds: 2
        # quiet window (ms) after the last conversation activity before a restart may fire
        settleMs: 2000
        # dsh web: reload the page when the host boot token changes
        autoReloadPage: true
        # hard-block shell commands that would kill/relaunch DSH by hand
        blockManualRestart: true
        healthPath: /__dsh_autorestart/health
        continuationText: ''
        # Take a snapshot of the profile before every restart, so a restart that
        # leaves the host unable to boot can be rolled back automatically.
        backupOnRestart: true
        # Include the installed plugin tree in that snapshot (bigger: ~120 MB here,
        # but it is what lets a rollback undo "a plugin upgrade broke the boot").
        # The first install asks once whether this should be on; the answer is
        # written to THIS key through the official configEditor service, so the
        # settings page and the one-time prompt always show the same value.
        backupIncludePlugins: true
        # Keep at most this many snapshots; older ones are deleted automatically.
        maxBackups: 2
        # How long the detached watcher waits for the relaunched host (ms) before
        # it restores the snapshot and launches the host again.
        rollbackTimeoutMs: 90000
        # 收工关机：Show the graceful-shutdown button at the foot of the left
        # sidebar, next to the Settings row (root scope: it is there even when
        # no conversation is open).
        # The button arms the countdown; the machine is switched off for real
        # (a WSL host shuts Windows down, not the WSL distribution).
        showSleepButton: true
        # How many seconds the countdown lasts after every conversation is done.
        # A DROPDOWN in the settings page: 0 / 10 / 20 / 30 / 60 seconds.
        # `0` means no countdown at all — the machine is switched off as soon
        # as every conversation is idle (the busy conversations still block
        # it). The plugin counts down itself, so the operating system is asked
        # to shut down immediately afterwards.
        sleepCountdownSeconds: 20
        # 收工关机只接受真人点击：the button needs a real gesture (a one-time
        # ticket the page got from this host, plus a fresh pointerdown). A
        # plain HTTP request is refused with 403 and nothing is armed.
        # Set this to false to let a script call the route directly.
        sleepHumanOnly: true
        # A custom shutdown command. Empty = the host is detected automatically
        # (Windows / WSL / Linux / macOS); a value replaces the detected command.
        sleepCommand: ''
