#
# 提交时机（用户 2026-10-29 拍板）：**等看门狗（t11）改完并验收通过后，和这一批一起发**，
# 不要单独提前提交——因为下面的“宿主起不来时自动还原再拉起”要等 t11 落地才成立。
#
# 文案要求（站点规则）：description.en 必须以句号结尾；描述里每个具体声明都要能在代码里对上。
# 用户口径：①等所有会话结束自动重启并继续 ②重启前备份配置和插件、起不来自动还原并报告
#          ③所有工作完成倒数关机 ④“多端通用”那句放最后。
#
# 提交时：把下面三个字段原样复制进站点那个 yml（url / name / category 照旧），删掉本段注释。

description:
  en: 'DeepSeek Harness plugin: restart without losing work. It waits until every conversation is idle, restarts the host, and picks the interrupted work back up instead of dying with it; where a supervisor already manages the host it asks that supervisor, and it never starts a second host next to a running one. Every restart is preceded by a snapshot of the configuration and the installed plugins; if the host does not come up, a one-shot watchdog restores that snapshot, starts once more, and records the outcome. When the work is done it counts down and powers the machine off, so nobody has to stay up at night. It works on the Windows desktop client and on a hosted dsh web instance (Windows, WSL, Linux).'
  zh: '重启不丢工作：等所有对话空闲后自动重启，重启后接着干、不中断；已有守护的机器交给守护重启，绝不双开。每次重启前自动备份配置和已装插件；宿主起不来时，由一次性看门狗自动还原这份备份、再拉起一次，并把结果记录下来。所有工作完成后倒数关机，晚上无需人值守。桌面客户端与 dsh web 托管端（Windows / WSL / Linux）都通用。'
